spring.application.name=AgenciaSpring
spring.graphql.graphiql.enabled=true
server.port=8082

# Conexión a Base de Datos en Railway (Reemplaza las variables con tus credenciales reales de la pestaña "Variables" de tu base de datos de Postgres en Railway si corres localmente)
spring.datasource.url=jdbc:postgresql://${RAILWAY_TCP_PROXY_DOMAIN}:${RAILWAY_TCP_PROXY_PORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL del nodo de Blockchain desplegado en Railway
blockchain.node.url=https://blockchain-agencia-production.up.railway.app

